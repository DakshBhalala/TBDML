[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compacttab"
version = "0.1.0"
description = "CompactTab: State-of-the-Art Parameter-Efficient Tabular Deep Learning Architecture and Benchmark Suite"
readme = "README.md"
authors = [
    { name = "Daksh Bhalala", email = "bhalaladaksh613@gmail.com" },
    { name = "CompactTab Research Team" }
]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["machine-learning", "tabular-data", "deep-learning", "foundation-models", "batch-ensemble", "benchmark", "autogluon", "tabarena"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/DakshBhalala/TBDML"
Repository = "https://github.com/DakshBhalala/TBDML"
"TabArena Pull Request" = "https://github.com/autogluon/tabarena/pull/676"
"Bug Tracker" = "https://github.com/DakshBhalala/TBDML/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
benchmark = [
    "openml>=0.14.0",
    "ucimlrepo>=0.0.6",
]

[project.scripts]
compacttab = "compacttab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B023", "E501"]
